<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batman | Comentários</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="./index.html" class="logo-link" aria-label="Página inicial do Batman">
        <img id="logo" src="./logo_batman.jpg" alt="Logo do Batman" />
      </a>
      <nav aria-label="Navegação principal">
        <ul class="main-menu">
          <li><a href="./index.html">Home</a></li>
          <li><a href="./contato.html">Contato</a></li>
          <li><a href="./fotos.html">Fotos</a></li>
          <li><a href="./comentarios.html">Comentários</a></li>
        </ul>
      </nav>
    </header>

    <main class="page-main">
      <section class="page-hero">
        <p class="eyebrow">Comunidade</p>
        <h1>Veja o que os fãs estão dizendo</h1>
      </section>

      <section class="comment-layout">
        <form id="form-comentario" class="comment-form" action="/api/comentarios" method="post">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" placeholder="Seu nome" required />

          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="seu@email.com" required />

          <label for="mensagem">Comentário</label>
          <textarea id="mensagem" name="mensagem" rows="5" placeholder="Deixe seu comentário..." required></textarea>

          <button class="button" type="submit">Publicar comentário</button>
          <p id="comentario-status" class="form-status" role="status" aria-live="polite"></p>
        </form>

        <div id="lista-comentarios" class="comment-list" aria-label="Comentários dos fãs" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer">
      <img id="logo-footer" src="./logo_batman.jpg" alt="Logo do Batman" />
      <span>Todos os direitos reservados ©</span>
      <span>Desenvolvido por: Andre Martins</span>
    </footer>

    <script>
      const form = document.getElementById("form-comentario");
      const statusElement = document.getElementById("comentario-status");
      const commentsContainer = document.getElementById("lista-comentarios");

      function renderComments(comments) {
        commentsContainer.replaceChildren();

        if (comments.length === 0) {
          const emptyMessage = document.createElement("p");
          emptyMessage.textContent = "Ainda não há comentários. Seja o primeiro a comentar!";
          commentsContainer.append(emptyMessage);
          return;
        }

        comments.forEach((comment) => {
          const item = document.createElement("article");
          item.className = "comment-item";

          const author = document.createElement("h2");
          author.textContent = comment.nome;

          const message = document.createElement("p");
          message.textContent = comment.mensagem;

          item.append(author, message);
          commentsContainer.append(item);
        });
      }

      async function loadComments() {
        const response = await fetch("/api/comentarios");
        if (!response.ok) {
          throw new Error("Não foi possível carregar os comentários.");
        }

        const comments = await response.json();
        if (!Array.isArray(comments)) {
          throw new Error("A resposta do servidor tem um formato inválido.");
        }

        renderComments(comments);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        statusElement.textContent = "";

        const formData = new FormData(form);
        const comment = {
          nome: formData.get("nome"),
          email: formData.get("email"),
          mensagem: formData.get("mensagem"),
        };

        let response;
        try {
          response = await fetch(form.action, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(comment),
          });
        } catch (error) {
          statusElement.textContent = error.message || "Ocorreu um erro ao enviar o comentário.";
          return;
        }

        if (!response.ok) {
          statusElement.textContent = "Não foi possível enviar o comentário. Tente novamente.";
          return;
        }

        form.reset();
        statusElement.textContent = "Comentário enviado com sucesso.";
        try {
          await loadComments();
        } catch (error) {
          statusElement.textContent = `Comentário enviado, mas a lista não pôde ser atualizada: ${error.message}`;
        }
      });

      loadComments().catch((error) => {
        commentsContainer.textContent = error.message || "Não foi possível carregar os comentários.";
      });
    </script>
  </body>
</html>
