<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batman | Comentários</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="./index.html" class="logo-link" aria-label="Página inicial do Batman">
        <img id="logo" src="./logo_batman.jpg" alt="Logo do Batman" />
      </a>
      <nav aria-label="Navegação principal">
        <ul class="main-menu">
          <li><a href="./index.html">Home</a></li>
          <li><a href="./contato.html">Contato</a></li>
          <li><a href="./fotos.html">Fotos</a></li>
          <li><a href="./comentarios.html">Comentários</a></li>
        </ul>
      </nav>
    </header>

    <main class="page-main comments-container">
      <section class="page-hero">
        <p class="eyebrow">Comunidade</p>
        <h1>Veja o que os fãs estão dizendo</h1>
      </section>

      <section class="comment-layout comments-content">
        <form id="form-comentario" class="comment-form" action="/api/comentarios" method="post">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" placeholder="Seu nome" maxlength="100" required />

          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="seu@email.com" maxlength="100" required />

          <div class="form-group">
            <label for="nota">Sua avaliação do filme</label>
            <select id="nota" name="nota" class="rating-select" required>
              <option value="5">⭐⭐⭐⭐⭐ (5/5 - Excelente)</option>
              <option value="4">⭐⭐⭐⭐ (4/5 - Muito bom)</option>
              <option value="3">⭐⭐⭐ (3/5 - Bom)</option>
              <option value="2">⭐⭐ (2/5 - Regular)</option>
              <option value="1">⭐ (1/5 - Ruim)</option>
            </select>
          </div>

          <label for="mensagem">Comentário</label>
          <textarea id="mensagem" name="mensagem" rows="5" maxlength="2000" placeholder="Deixe seu comentário..." required></textarea>

          <button class="button" type="submit">Publicar comentário</button>
          <p id="comentario-status" class="form-status" role="status" aria-live="polite"></p>
        </form>

        <section class="comment-feed comments-feed" aria-label="Comentários dos fãs">
          <div class="comment-feed-heading feed-header">
            <div>
              <h2>Comentários da Comunidade</h2>
              <p id="media-comentarios" class="comment-average">Média: —</p>
            </div>
            <label class="comment-sort-label" for="ordenacao-comentarios">
              Ordenar por
              <select id="ordenacao-comentarios">
                <option value="recentes">Mais recentes</option>
                <option value="melhores">Melhores avaliações</option>
              </select>
            </label>
          </div>
          <div id="lista-comentarios" class="comment-list feed-list" aria-live="polite" aria-busy="true"></div>
        </section>
      </section>
    </main>

    <footer class="site-footer">
      <img id="logo-footer" src="./logo_batman.jpg" alt="Logo do Batman" />
      <span>Todos os direitos reservados ©</span>
      <span>Desenvolvido por: Andre Martins</span>
    </footer>

    <script src="./comentarios.js" defer></script>
  </body>
</html>
