<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batman | Fotos</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="./index.html" class="logo-link" aria-label="Página inicial do Batman">
        <img id="logo" src="./logo_batman.jpg" alt="Logo do Batman" />
      </a>
      <nav aria-label="Navegação principal">
        <ul class="main-menu">
          <li><a href="./index.html">Home</a></li>
          <li><a href="./contato.html">Contato</a></li>
          <li><a href="./fotos.html">Fotos</a></li>
          <li><a href="./comentarios.html">Comentários</a></li>
        </ul>
      </nav>
    </header>

    <main class="page-main">
      <section class="page-hero">
        <p class="eyebrow">Galeria</p>
        <h1>Momentos de Gotham</h1>
      </section>

      <section class="gallery-grid" aria-label="Galeria de fotos do filme">
        <figure class="photo-card photo-1">
          <figcaption>Batman em Gotham</figcaption>
        </figure>
        <figure class="photo-card photo-2">
          <figcaption>Mulher-Gato</figcaption>
        </figure>
        <figure class="photo-card photo-3">
          <figcaption>Alfred e Bruce</figcaption>
        </figure>
        <figure class="photo-card photo-4">
          <figcaption>Gotham à noite</figcaption>
        </figure>
        <figure class="photo-card photo-5">
          <figcaption>Charada</figcaption>
        </figure>
        <figure class="photo-card photo-6">
          <figcaption>James Gordon</figcaption>
        </figure>
      </section>
    </main>

    <footer class="site-footer">
      <img id="logo-footer" src="./logo_batman.jpg" alt="Logo do Batman" />
      <span>Todos os direitos reservados ©</span>
      <span>Desenvolvido por: Andre Martins</span>
    </footer>
  </body>
</html>
