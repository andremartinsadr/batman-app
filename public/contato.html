<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batman | Contato</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="./index.html" class="logo-link" aria-label="Página inicial do Batman">
        <img id="logo" src="./logo_batman.jpg" alt="Logo do Batman" />
      </a>
      <nav aria-label="Navegação principal">
        <ul class="main-menu">
          <li><a href="./index.html">Home</a></li>
          <li><a href="./contato.html">Contato</a></li>
          <li><a href="./fotos.html">Fotos</a></li>
          <li><a href="./comentarios.html">Comentários</a></li>
        </ul>
      </nav>
    </header>

    <main class="page-main">
      <section class="page-hero">
        <p class="eyebrow">Batman 2022</p>
        <h1>Fale com a equipe</h1>
      </section>

      <section class="contact-shell">
        <form class="contact-form">
          <label>
            Nome
            <input type="text" placeholder="Seu nome" />
          </label>
          <label>
            Email
            <input type="email" placeholder="seu@email.com" />
          </label>
          <label>
            Mensagem
            <textarea rows="6" placeholder="Escreva sua mensagem..."></textarea>
          </label>
          <button class="button" type="submit">Enviar mensagem</button>
        </form>

        <aside class="contact-info">
          <div class="info-card">
            <h2>Contato</h2>
            <p>Gotham City, DC Universe</p>
            <p>(11) 4002-8922</p>
            <p>contato@batmanmovie.com</p>
          </div>
          <div class="info-card">
            <h2>Horários</h2>
            <p>Segunda a sexta: 08h às 18h</p>
            <p>Sábado: 09h às 13h</p>
          </div>
        </aside>
      </section>
    </main>

    <footer class="site-footer">
      <img id="logo-footer" src="./logo_batman.jpg" alt="Logo do Batman" />
      <span>Todos os direitos reservados ©</span>
      <span>Desenvolvido por: Andre Martins</span>
    </footer>
  </body>
</html>
